<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Chroma</title>
<style>
  :root { --bg: #F3F3F3; --surface: #FFFFFF; --ink: #111111; --muted: #595959; --line: #D0D0D0; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #121212; --surface: #1C1C1C; --ink: #F2F2F2; --muted: #A8A8A8; --line: #333333; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 40px 20px; background: var(--bg); color: var(--ink);
    font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  main { max-width: 420px; width: 100%; }
  .strip { display: flex; height: 24px; border-radius: 12px; overflow: hidden; margin-bottom: 28px; }
  .strip span { flex: 1; }
  h1 { font-size: 1.6rem; font-weight: 600; letter-spacing: -0.01em; margin: 0 0 10px; }
  p { color: var(--muted); margin: 0 0 28px; }
  .stores { display: flex; flex-direction: column; gap: 10px; }
  .stores a {
    display: block; text-align: center; padding: 14px; border-radius: 26px; text-decoration: none;
    font-weight: 500; color: var(--ink); background: var(--surface); border: 1px solid var(--line);
  }
  .home { color: var(--ink); }
</style>
</head>
<body>
<main>
  <div class="strip">
    <span style="background:#E07A5F"></span><span style="background:#F2CC8F"></span>
    <span style="background:#81B29A"></span><span style="background:#5B8DB8"></span>
    <span style="background:#3D5A80"></span><span style="background:#C77DC4"></span>
    <span style="background:#DCC6A0"></span>
  </div>
  <h1 id="title"></h1>
  <p id="text"></p>
  <div class="stores" id="stores" hidden>
    <a id="play" href="https://play.google.com/store/apps/details?id=com.baltajmn.color">Google Play</a>
    <a id="appstore" href="#">App Store</a>
  </div>
</main>
<script>
  // GitHub Pages serves this page for any path it does not know, so it is the invite landing too:
  // with the app installed the link never gets here, it opens the app instead.
  var APP_STORE_ID = "6819301462";
  var T = {
    en: ["You have been invited to Chroma", "One photo a day, one color you choose. Install Chroma, then open this link again to send the request.", "This page does not exist.", "You have been invited to a group on Chroma", "One photo a day, one color you choose. Install Chroma, then open this link again to join the group."],
    es: ["Te han invitado a Chroma", "Una foto al día, un color que eliges. Instala Chroma y vuelve a abrir este enlace para enviar la solicitud.", "Esta página no existe.", "Te han invitado a un grupo en Chroma", "Una foto al día, un color que eliges. Instala Chroma y vuelve a abrir este enlace para entrar en el grupo."],
    pt: ["Você foi convidado para o Chroma", "Uma foto por dia, uma cor que você escolhe. Instale o Chroma e abra este link de novo para enviar o pedido.", "Esta página não existe.", "Você foi convidado para um grupo no Chroma", "Uma foto por dia, uma cor que você escolhe. Instale o Chroma e abra este link de novo para entrar no grupo."],
    de: ["Du wurdest zu Chroma eingeladen", "Ein Foto am Tag, eine Farbe, die du wählst. Installiere Chroma und öffne diesen Link dann noch einmal, um die Anfrage zu senden.", "Diese Seite gibt es nicht.", "Du wurdest in eine Gruppe auf Chroma eingeladen", "Ein Foto am Tag, eine Farbe, die du wählst. Installiere Chroma und öffne diesen Link dann noch einmal, um der Gruppe beizutreten."],
    fr: ["On t'a invité sur Chroma", "Une photo par jour, une couleur que tu choisis. Installe Chroma, puis rouvre ce lien pour envoyer la demande.", "Cette page n'existe pas.", "On t'a invité dans un groupe sur Chroma", "Une photo par jour, une couleur que tu choisis. Installe Chroma, puis rouvre ce lien pour rejoindre le groupe."],
    it: ["Ti hanno invitato su Chroma", "Una foto al giorno, un colore che scegli tu. Installa Chroma, poi riapri questo link per inviare la richiesta.", "Questa pagina non esiste.", "Ti hanno invitato in un gruppo su Chroma", "Una foto al giorno, un colore che scegli tu. Installa Chroma, poi riapri questo link per entrare nel gruppo."],
    nl: ["Je bent uitgenodigd voor Chroma", "Een foto per dag, één kleur die je zelf kiest. Installeer Chroma en open deze link daarna opnieuw om het verzoek te versturen.", "Deze pagina bestaat niet.", "Je bent uitgenodigd voor een groep op Chroma", "Een foto per dag, één kleur die je zelf kiest. Installeer Chroma en open deze link daarna opnieuw om je bij de groep aan te sluiten."],
    pl: ["Ktoś zaprosił cię do Chroma", "Jedno zdjęcie dziennie, jeden kolor, który wybierasz. Zainstaluj Chroma, a potem otwórz ten link jeszcze raz, aby wysłać zaproszenie.", "Ta strona nie istnieje.", "Ktoś zaprosił cię do grupy w Chroma", "Jedno zdjęcie dziennie, jeden kolor, który wybierasz. Zainstaluj Chroma, a potem otwórz ten link jeszcze raz, aby dołączyć do grupy."],
    ru: ["Тебя пригласили в Chroma", "Одно фото в день, один цвет, который выбираешь ты. Установи Chroma, а потом ещё раз открой эту ссылку, чтобы отправить запрос.", "Этой страницы не существует.", "Тебя пригласили в группу в Chroma", "Одно фото в день, один цвет, который выбираешь ты. Установи Chroma, а потом ещё раз открой эту ссылку, чтобы вступить в группу."],
    tr: ["Chroma'ya davet edildin", "Günde bir fotoğraf, senin seçtiğin bir renk. Chroma'yı yükle, sonra isteği göndermek için bu bağlantıyı tekrar aç.", "Bu sayfa mevcut değil.", "Chroma'da bir gruba davet edildin", "Günde bir fotoğraf, senin seçtiğin bir renk. Chroma'yı yükle, sonra gruba katılmak için bu bağlantıyı tekrar aç."],
    id: ["Kamu diundang ke Chroma", "Satu foto sehari, satu warna pilihanmu. Instal Chroma, lalu buka tautan ini lagi untuk mengirim permintaan.", "Halaman ini tidak ada.", "Kamu diundang ke grup di Chroma", "Satu foto sehari, satu warna pilihanmu. Instal Chroma, lalu buka tautan ini lagi untuk masuk grup."],
    ja: ["Chromaに招待されました", "1日1枚の写真と、あなたが選ぶ1つの色。Chromaをインストールしてから、このリンクをもう一度開いてリクエストを送ってください。", "このページは存在しません。", "Chromaのグループに招待されました", "1日1枚の写真と、あなたが選ぶ1つの色。Chromaをインストールしてから、このリンクをもう一度開いてグループに参加してください。"],
    ko: ["Chroma에 초대받았어요", "하루에 사진 한 장, 직접 고르는 색 하나. Chroma를 설치한 다음 이 링크를 다시 열어 요청을 보내 주세요.", "이 페이지는 존재하지 않아요.", "Chroma의 그룹에 초대받았어요", "하루에 사진 한 장, 직접 고르는 색 하나. Chroma를 설치한 다음 이 링크를 다시 열어 그룹에 들어오세요."]
  };
  var lang = (navigator.language || "en").slice(0, 2);
  // Android's old code for Indonesian, which the app reads as id too.
  if (lang === "in") lang = "id";
  var t = T[lang] || T.en;
  document.documentElement.lang = T[lang] ? lang : "en";
  // A friend's link is /i/<code>; a group's, /i/g<code> (docs/tecnico.md 9.5 of BaltaJmn/color).
  var invite = /^\/i\/(g?)[0-9a-fA-F]{10}\/?$/.exec(location.pathname);
  if (invite) {
    var group = invite[1] === "g";
    document.getElementById("title").textContent = t[group ? 3 : 0];
    document.getElementById("text").textContent = t[group ? 4 : 1];
    document.getElementById("stores").hidden = false;
    var apple = document.getElementById("appstore");
    if (APP_STORE_ID) apple.href = "https://apps.apple.com/app/id" + APP_STORE_ID; else apple.remove();
    // On a phone, only its own store: Play on Android, the App Store on iPhone and iPad (an iPad can
    // say it is a Mac, but a Mac has no touch screen). Anywhere else, both.
    var ua = navigator.userAgent;
    var ios = /iPhone|iPad|iPod/.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
    if (/Android/.test(ua)) apple.remove();
    else if (ios) document.getElementById("play").remove();
  } else {
    document.getElementById("title").textContent = t[2];
    var home = document.createElement("a");
    home.href = "/"; home.className = "home"; home.textContent = "Chroma";
    document.getElementById("text").appendChild(home);
  }
</script>
</body>
</html>
